name: Release

# Push a vX.Y.Z tag matching package.json to publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only v* tags may deploy to this environment, and npm trusts only this workflow in it.
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write # GitHub release page
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.2
      - name: Tag must match package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      # No NPM_TOKEN: npm exchanges this job's OIDC identity for a one-off publish token.
      # A version already on npm (1.0.0 was published by hand to create the package) is skipped.
      - name: Publish to npm
        run: |
          if [ -n "$(npm view "@assinafy/embed-sdk@${GITHUB_REF_NAME#v}" version 2>/dev/null)" ]; then
            echo "@assinafy/embed-sdk@${GITHUB_REF_NAME#v} is already on npm; skipping."
          else
            npm publish --ignore-scripts
          fi
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
